<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo}">SIGA 2</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header class="site-header" th:fragment="menu"
        xmlns:sec="https://www.thymeleaf.org/extras/spring-security">
    <a class="marca" th:href="@{/}">SIGA</a>
    <nav class="site-nav" aria-label="Navegação principal">
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/cursos}">Cursos</a>
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/disciplinas}">Disciplinas</a>
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/turmas}">Turmas</a>
        <a sec:authorize="hasRole('PROFESSOR')" th:href="@{/professor/aulas}">Minhas aulas</a>
        <a sec:authorize="hasRole('ALUNO')" th:href="@{/aluno/aulas}">Minhas aulas</a>
        <a sec:authorize="hasRole('ALUNO')" th:href="@{/aluno/frequencia}">Frequência</a>
    </nav>
    <form class="logout-form" th:action="@{/logout}" method="post">
        <button class="nav-logout" type="submit">Sair</button>
    </form>
</header>
</body>
</html>
