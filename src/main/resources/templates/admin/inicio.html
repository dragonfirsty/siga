<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="https://www.thymeleaf.org/extras/spring-security">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Administrador - SIGA</title>
	<link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
	<header th:replace="~{fragments/layout :: menu}"></header>
	<main>
		<h1>Área do Administrador</h1>
		<div class="card">
			<p>Bem-vindo, <strong sec:authentication="name"></strong>.</p>
			<p>Gerencie os cursos, disciplinas e turmas do sistema pelos atalhos abaixo.</p>
			<p style="display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px">
				<a class="btn" th:href="@{/admin/cursos}">Cursos</a>
				<a class="btn" th:href="@{/admin/disciplinas}">Disciplinas</a>
				<a class="btn" th:href="@{/admin/turmas}">Turmas</a>
			</p>
		</div>
	</main>
</body>
</html>
