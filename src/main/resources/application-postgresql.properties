server.port=${PORT:8080}

spring.datasource.url=${JDBC_DATABASE_URL:${POSTGRES_URL:jdbc:postgresql://localhost:5432/siga}}
spring.datasource.username=${POSTGRES_USER:${PGUSER:siga}}
spring.datasource.password=${POSTGRES_PASSWORD:${PGPASSWORD:siga}}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
